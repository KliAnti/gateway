
name: CI ASP.NET 10

on:
  push:
    branches:
      - main
      - VA-76
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate GitHub Packages
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget update source github \
            --source "https://nuget.pkg.github.com/KliAnti/index.json" \
            --username "$USERNAME" \
            --password "$TOKEN" \
            --store-password-in-clear-text

      - name: Restore
        run: dotnet restore gateway.slnx

      - name: Build
        run: dotnet build gateway.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test gateway.slnx --configuration Release --no-build --no-restore --verbosity normal
